name: Bug report
description: Wrong results, crash, or an unexpected fallback
labels: [bug]
body:
  - type: textarea
    id: status
    attributes:
      label: Output of `python -c "import unimol_accel as c; print(c.status())"`
      render: text
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Does the problem disappear with `CHEMPROP_ACCEL_DISABLE=1`? Please say so.
      render: python
  - type: input
    id: env
    attributes:
      label: OS / CPU / Python / PyTorch / Uni-Mol versions
