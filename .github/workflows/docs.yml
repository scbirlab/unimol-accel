name: Docs & benchmark report

# Builds the Sphinx docs and a multi-runner benchmark report, then publishes both to GitHub Pages:
#   https://<owner>.github.io/<repo>/                       documentation
#   https://<owner>.github.io/<repo>/benchmarks/report/     benchmark report (latest main)
# One-time setup (required, cannot be done by the workflow): Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Until then the `deploy` job fails with instructions (the HTML is still
# available as the `docs-html` and `bench-report` artifacts of the run). Nothing here runs unless the repository owner
# enables it; this repository was prepared read-only and has not been pushed.

on:
  push:
    branches: [main]
  pull_request:
    paths: ["docs/**", "src/**", ".github/workflows/docs.yml"]
  schedule:
    - cron: "17 4 * * 1"   # weekly, to track runner/dependency drift
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "unimol-tools>=0.1.6"
      - run: pip install -e ".[docs]"
      - name: Build docs (warnings are errors)
        env: {GITHUB_REPOSITORY: "${{ github.repository }}"}
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with: {name: docs-html, path: docs/_build/html}

  bench:
    name: bench · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python }}", cache: pip}
      - name: Install CPU PyTorch (Linux)
        if: runner.os != 'macOS'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install PyTorch (macOS)
        if: runner.os == 'macOS'
        run: pip install torch
      - run: pip install "unimol-tools>=0.1.6"
      - run: pip install -e ".[bench]"
      - run: python -m unimol_accel status
      - name: Benchmark (speed + equivalence; offline, random weights)
        shell: bash
        run: |
          NAME="${{ matrix.os }}-py${{ matrix.python }}"
          python -m unimol_accel.bench --preset ci --name "$NAME" --output bench-out --max-minutes 30
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}-py${{ matrix.python }}
          path: bench-out/results-*.json
          if-no-files-found: warn

  report:
    needs: bench
    if: always() && needs.bench.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with: {pattern: "bench-*", path: results, merge-multiple: true}
      - name: Build combined HTML report (report.py is stdlib-only; no torch needed)
        run: |
          ls results
          python src/unimol_accel/bench/report.py results/results-*.json -o report/index.html \
            --title "unimol_accel benchmarks — ${GITHUB_SHA::7}"
          mkdir -p report/data && cp results/results-*.json report/data/
      - uses: actions/upload-artifact@v4
        with: {name: bench-report, path: report}
      - name: Fail if any equivalence check failed
        run: |
          python - <<'PY'
          import glob, json, sys
          bad = [(p, e["key"]) for p in glob.glob("results/results-*.json")
                 for e in json.load(open(p)).get("equivalence", []) if not e["passed"]]
          for b in bad: print("EQUIVALENCE FAILURE:", b)
          sys.exit(1 if bad else 0)
          PY

  deploy:
    needs: [docs, report]
    if: github.event_name != 'pull_request' && needs.docs.result == 'success' && needs.report.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # `actions/deploy-pages` answers "404 Not Found" when GitHub Pages is not enabled for the repo.
      # The default GITHUB_TOKEN cannot enable it, so check first and explain instead of failing.
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/${REPO}/pages" --jq '.build_type' > pages_type.txt 2> pages_err.txt; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages is enabled (build_type: $(cat pages_type.txt))"
            if [ "$(cat pages_type.txt)" != "workflow" ]; then
              echo "::warning title=Pages source::Pages source is '$(cat pages_type.txt)', not 'GitHub Actions'. Set Settings > Pages > Build and deployment > Source = GitHub Actions."
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            cat pages_err.txt
            echo "::error title=GitHub Pages is not enabled::Open https://github.com/${REPO}/settings/pages and set Build and deployment > Source = 'GitHub Actions', then re-run this workflow. The site was built and is available as the docs-html and bench-report artifacts."
          fi
      - uses: actions/download-artifact@v4
        if: steps.pages.outputs.enabled == 'true'
        with: {name: docs-html, path: site}
      - uses: actions/download-artifact@v4
        if: steps.pages.outputs.enabled == 'true'
        with: {name: bench-report, path: site/benchmarks/report}
      - if: steps.pages.outputs.enabled == 'true'
        run: touch site/.nojekyll
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      # Unique artifact name per attempt: "Re-run failed jobs" keeps the previous attempt's artifacts in the
      # same run, and deploy-pages refuses to continue when it finds two artifacts called "github-pages".
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      # Make the job (and therefore the workflow) red, with the explanation above, when Pages is off.
      - name: Fail with instructions if Pages is not enabled
        if: steps.pages.outputs.enabled != 'true'
        run: exit 1
